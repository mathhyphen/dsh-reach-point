<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="820" height="560" rx="18" fill="url(#bg)"/>
  <text x="410" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#e2e8f0">输入定位刻度栏 · 安装后效果</text>
  <text x="410" y="60" text-anchor="middle" font-size="12.5" fill="#94a3b8">对话左侧 Codex 风格刻度栏：每次真实用户输入一条刻度，悬停显示摘要卡（示例数据）</text>

  <!-- conversation mock -->
  <rect x="130" y="86" width="660" height="440" rx="12" fill="#1b202b" stroke="#2b3245"/>

  <!-- user bubble 1 -->
  <rect x="400" y="108" width="300" height="52" rx="10" fill="#2f3a50"/>
  <text x="420" y="132" font-size="12.5" fill="#dbe4f3">帮我分析一下这份数据的分布情况</text>
  <text x="420" y="150" font-size="10.5" fill="#8b95a7">用户 · 09:12</text>

  <!-- assistant bubble 1 -->
  <rect x="170" y="176" width="470" height="58" rx="10" fill="#242c3b"/>
  <text x="190" y="200" font-size="12.5" fill="#c6d0e0">好的，我统计了 1,284 条样本：均值 42.6，中位数 38.2，</text>
  <text x="190" y="218" font-size="12.5" fill="#c6d0e0">分布右偏，长尾集中在 60~90 区间…</text>

  <!-- user bubble 2 -->
  <rect x="400" y="250" width="320" height="52" rx="10" fill="#2f3a50"/>
  <text x="420" y="274" font-size="12.5" fill="#dbe4f3">那异常值是怎么处理的？有没有去重？</text>
  <text x="420" y="292" font-size="10.5" fill="#8b95a7">用户 · 09:14</text>

  <!-- assistant bubble 2 -->
  <rect x="170" y="318" width="470" height="58" rx="10" fill="#242c3b"/>
  <text x="190" y="342" font-size="12.5" fill="#c6d0e0">做了 3σ 截断（去 27 个离群点）并按主键去重，</text>
  <text x="190" y="360" font-size="12.5" fill="#c6d0e0">重复率约 1.8%，不影响整体结论…</text>

  <!-- user bubble 3 (current) -->
  <rect x="400" y="392" width="300" height="52" rx="10" fill="#2f3a50"/>
  <text x="420" y="416" font-size="12.5" fill="#dbe4f3">把结果画成图，标注一下长尾区间</text>
  <text x="420" y="434" font-size="10.5" fill="#8b95a7">用户 · 09:15</text>

  <!-- assistant bubble 3 -->
  <rect x="170" y="460" width="440" height="46" rx="10" fill="#242c3b"/>
  <text x="190" y="486" font-size="12.5" fill="#c6d0e0">收到，正在生成分布图…</text>

  <!-- rail -->
  <g filter="url(#shadow)">
  <rect x="88" y="100" width="36" height="412" rx="10" fill="rgba(34,38,46,.72)"/>
  <!-- ticks: mark width 6, current 24, hover 15 -->
  <rect x="96" y="118" width="6" height="2" rx="1" fill="rgba(176,182,194,.48)"/>
  <rect x="96" y="136" width="6" height="2" rx="1" fill="rgba(176,182,194,.48)"/>
  <rect x="96" y="154" width="6" height="2" rx="1" fill="rgba(176,182,194,.48)"/>
  <rect x="96" y="172" width="15" height="2" rx="1" fill="rgba(222,226,234,.76)"/>
  <rect x="96" y="190" width="6" height="2" rx="1" fill="rgba(176,182,194,.48)"/>
  <rect x="96" y="208" width="6" height="2" rx="1" fill="rgba(176,182,194,.48)"/>
  <rect x="96" y="226" width="6" height="2" rx="1" fill="rgba(176,182,194,.48)"/>
  <rect x="96" y="244" width="6" height="2" rx="1" fill="rgba(176,182,194,.48)"/>
  <rect x="96" y="262" width="6" height="2" rx="1" fill="rgba(176,182,194,.48)"/>
  <rect x="96" y="280" width="6" height="2" rx="1" fill="rgba(176,182,194,.48)"/>
  <rect x="96" y="298" width="6" height="2" rx="1" fill="rgba(176,182,194,.48)"/>
  <rect x="96" y="316" width="6" height="2" rx="1" fill="rgba(176,182,194,.48)"/>
  <rect x="96" y="334" width="6" height="2" rx="1" fill="rgba(176,182,194,.48)"/>
  <rect x="96" y="352" width="6" height="2" rx="1" fill="rgba(176,182,194,.48)"/>
  <rect x="96" y="370" width="24" height="2" rx="1" fill="#f2f4f8"/>
  <rect x="96" y="388" width="6" height="2" rx="1" fill="rgba(176,182,194,.48)"/>
  <rect x="96" y="406" width="6" height="2" rx="1" fill="rgba(176,182,194,.48)"/>
  <rect x="96" y="424" width="6" height="2" rx="1" fill="rgba(176,182,194,.48)"/>
  <rect x="96" y="442" width="6" height="2" rx="1" fill="rgba(176,182,194,.48)"/>
  <rect x="96" y="460" width="6" height="2" rx="1" fill="rgba(176,182,194,.48)"/>
  </g>

  <!-- preview card on hover (tick at y=172) -->
  <g filter="url(#shadow)">
  <rect x="136" y="146" width="278" height="58" rx="13" fill="rgba(34,38,46,.98)" stroke="rgba(255,255,255,.09)"/>
  <text x="152" y="168" font-size="12" font-weight="600" fill="#f0f2f6">好的，我统计了 1,284 条样本…</text>
  <text x="152" y="186" font-size="11" fill="#9da4b2">用户 · 09:12 · 2 条消息前</text>
  </g>
  <!-- pointer line from preview to tick -->
  <line x1="136" y1="175" x2="103" y2="173" stroke="rgba(222,226,234,.6)" stroke-width="2"/>

  <!-- callouts -->
  <text x="410" y="545" text-anchor="middle" font-size="11.5" fill="#64748b">当前阅读位置 = 加长刻度　·　悬停任意刻度显示摘要　·　点击跳转并高亮　·　滚轮逐条浏览　·　方向键 / Home / End / Space</text>
</svg>
